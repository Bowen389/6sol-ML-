name: SteamDT 裸K每日观察
on:
  schedule:
    - cron: '25 2 * * *' # UTC 02:25 / JST 11:25; adjust if daily data is not finalized then
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch 1,571 item K-lines directly from SteamDT
        env:
          STEAMDT_API_KEY: ${{ secrets.STEAMDT_API_KEY }}
          STEAMDT_KLINE_TYPE: ${{ vars.STEAMDT_KLINE_TYPE || '1' }}
        run: python fetch_steamdt.py
      - name: Scan latest complete daily bars
        run: python scan.py --input 'data/live.csv'
      - name: Publish report to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.md reports/latest_candidates.csv
          git diff --cached --quiet || (git commit -m "Update SteamDT naked-K watchlist" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-watchlist
          path: reports/
          if-no-files-found: ignore
